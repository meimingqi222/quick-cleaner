[package]
name = "quick-cleaner"
version = "0.0.9"
edition = "2021"
default-run = "quick-cleaner"

[dependencies]
# `default-features = false` 关掉 Linux 的 wayland/x11 和 Windows 的 manifest，
# 但必须保留 `font-kit`——否则 macOS 上会用 NoopTextSystem，文字全部不可见
# （光栅化返回空像素，布局占位但渲染透明）。
# runtime_shaders：gpui 默认在 build.rs 里调 `xcrun metal` 预编译 shader，
# 新版 Xcode 把 Metal Toolchain 拆成了独立下载组件，没装的机器（包括这台
# 和部分 CI runner）构建直接失败。开这个特性把 shader 挪到启动时编译，
# 代价是一次几十毫秒，换来构建不再依赖 Metal Toolchain。
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
walkdir = "2"
rayon = "1"
dirs = "5"
serde = { version = "1", features = ["derive"] }
# 只给 core/settings.rs 用：读写 %APPDATA%\QuickCleaner\settings.json
serde_json = "1"
chrono = "0.4"
lz4_flex = "0.14.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# 状态监控页的 CPU / 内存 / 进程 / 网络采样。关掉默认特性只留需要的，
# 否则会把用户枚举、磁盘枚举等一整套拉进编译。
sysinfo = { version = "0.37", default-features = false, features = ["system", "network", "multithread"] }
# 自动更新：阻塞 HTTP 拉 GitHub Releases，无 async runtime
ureq = { version = "2.12", features = ["json"] }
# 解压发行 zip；sha2 做 sidecar 校验
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[lints.rust]
# objc 0.2 的 `msg_send!` 展开里带着 `#[cfg(feature = "cargo-clippy")]`——那是
# clippy 早年的检测方式，现已废弃。每个调用点都会报一条 unexpected_cfgs，
# 而 CI 跑的是 `clippy -- -D warnings`，不消掉会直接挂。
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[target.'cfg(target_os = "macos")'.dependencies]
bincode = "1.3.3"
fsevent-sys = "4.1.0"
zstd = "0.13"
# 卷容量走 statfs(2)，废纸篓走 NSFileManager。两者都要 C / Objective-C 运行时；
# libc 与 objc 本来就作为传递依赖在依赖树里，显式声明不引入新的下载。
libc = "0.2"
objc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["shellapi", "winbase", "winnt", "minwinbase", "fileapi", "handleapi", "shobjidl", "shlobj", "shtypes", "objbase", "combaseapi", "ioapiset", "winioctl", "errhandlingapi", "processthreadsapi", "securitybaseapi", "sddl", "winreg", "tlhelp32", "winnls", "winsvc", "processenv", "impl-default", "winuser", "wingdi", "synchapi", "sysinfoapi", "minwindef", "basetsd", "windef", "winerror", "pdh", "dxgi", "dxgiformat", "dxgitype", "d3d9types", "unknwnbase", "wbemcli", "oaidl", "oleauto", "rpcdce", "rpc", "rpcndr", "wtypes", "wtypesbase", "ntdef", "objidlbase", "objidl", "propidl"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

# MFT 校验 CLI 不是产品入口。不声明成 `[[bin]]`，否则 cargo-bundle 会把它
# 打进 .app。example + required-features：默认构建 / clippy / bundle 都跳过，
# macOS 上不会出现这个可执行文件。
[features]
mftscan = []
hwprobe = []
cdprobe = []
fanprobe = []
authprobe = []
fseprobe = []
thermalprobe = []

[[example]]
name = "mftscan"
path = "examples/mftscan.rs"
required-features = ["mftscan"]

[[example]]
name = "fseprobe"
path = "examples/fseprobe.rs"
required-features = ["fseprobe"]

[[example]]
name = "thermalprobe"
path = "examples/thermalprobe.rs"
required-features = ["thermalprobe"]

[package.metadata.bundle]
name = "QuickCleaner"
identifier = "com.quickcleaner.app"
icon = ["assets/icon.icns", "assets/icon-512.png", "assets/icon.png"]
category = "Utilities"
short_description = "Cross-platform disk cleaner and space analyzer"
long_description = "QuickCleaner scans for junk files, analyzes disk usage, and manages installed applications on macOS and Windows."

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

# MFT 解析是纯计算密集循环，debug 下不开优化测出来的耗时没有参考价值。
# 依赖已经在 profile.dev.package."*" 里是 opt-level 2，这里只额外优化本 crate，
# 不会触发依赖重编译。
[profile.dev.package.quick-cleaner]
opt-level = 2

[[example]]
name = "hwprobe"
path = "examples/hwprobe.rs"
required-features = ["hwprobe"]

[[example]]
name = "cdprobe"
path = "examples/cdprobe.rs"
required-features = ["cdprobe"]

[[example]]
name = "fanprobe"
path = "examples/fanprobe.rs"
required-features = ["fanprobe"]

[[example]]
name = "authprobe"
path = "examples/authprobe.rs"
required-features = ["authprobe"]

# crates.io 的 gpui 停在 0.2.2，上游仓库（zed main，gpui_macos）已修掉
# 一个 macOS 主线程死锁：window_did_change_key_status 持 window_state
# 锁时调 resignKeyWindow，resign 同步发出 windowDidResignKey 通知重入
# 同一回调，parking_lot 不可重入 → 卡死（macOS 27 窗口状态恢复时实测
# 可复现）。vendor/gpui 是 0.2.2 原样拷贝，只打上游同款补丁（先
# drop(lock) 再 resignKeyWindow）。升级到官方带修复的版本后删掉本节。
[patch.crates-io]
gpui = { path = "vendor/gpui" }
