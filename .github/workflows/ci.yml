name: CI

on:
  push:
    branches: [ "master", "main" ]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
      - ".github/workflows/release.yml"
  pull_request:
    branches: [ "master", "main" ]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      # clippy 而不只是 rustc：registry.rs 那批「public fn 收裸指针却不是 unsafe」
      # 属于 deny 级 lint，cargo build/test 全绿也照样漏过去。
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test

  # 只跑 Windows 的代价已经吃过一次：`src/bin/mftscan.rs` 无条件 import
  # `platform::mft`，macOS 上 `cargo build` 直接失败，却一直没人拦住。
  # 平台适配层是双分支的，CI 也必须是。
  test-macos:
    name: Test (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # 废纸篓往返那个用例标了 #[ignore]：它会真的往运行者的废纸篓里写东西。
      - name: Run tests
        run: cargo test
