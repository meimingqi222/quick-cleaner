name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-release:
    name: Build & Release (Windows x86_64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release

      - name: Package Windows distribution
        shell: pwsh
        run: |
          $distDir = "dist/quick-cleaner-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          
          # 只发 GUI 主程序；mftscan 是开发期的 MFT 校验 CLI，不进发行包
          Copy-Item "target/release/quick-cleaner.exe" "$distDir/"
          
          # 拷贝双语说明与开源协议
          if (Test-Path "README.md") { Copy-Item "README.md" "$distDir/" }
          if (Test-Path "README_zh.md") { Copy-Item "README_zh.md" "$distDir/" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "$distDir/" }
          
          # 压缩
          Compress-Archive -Path "$distDir/*" -DestinationPath "dist/quick-cleaner-windows-x86_64.zip" -Force
          
          # SHA256 校验和
          $hash = (Get-FileHash -Path "dist/quick-cleaner-windows-x86_64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  quick-cleaner-windows-x86_64.zip" | Out-File -Encoding utf8 "dist/quick-cleaner-windows-x86_64.zip.sha256"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/quick-cleaner-windows-x86_64.zip
            dist/quick-cleaner-windows-x86_64.zip.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
