name: Publish official cleanup rules
on:
  workflow_dispatch:
    inputs:
      sequence:
        description: Monotonically increasing rule sequence
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: official-rules-release
  cancel-in-progress: false
jobs:
  validate:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib
      - run: cargo run --example rules -- check
  publish:
    needs: validate
    runs-on: windows-latest
    environment: official-rules
    env:
      GH_TOKEN: ${{ github.token }}
      RULE_SEQUENCE: ${{ inputs.sequence }}
      QC_RULE_KEY_ID: ${{ vars.QC_RULE_KEY_ID }}
      QC_RULE_PRIVATE_KEY: ${{ secrets.QC_RULE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate release identity and refuse immutable overwrite
        shell: pwsh
        run: |
          if ($env:RULE_SEQUENCE -notmatch '^[1-9][0-9]{0,18}$') { throw 'Invalid sequence' }
          if (-not $env:QC_RULE_PRIVATE_KEY -or -not $env:QC_RULE_KEY_ID) { throw 'Rule signing key not configured' }
          $tags = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect releases; refusing to publish' }
          $sequence = [uint64]$env:RULE_SEQUENCE
          foreach ($tag in $tags) {
            if ($tag -match '^rules-v([1-9][0-9]*)$' -and [uint64]$Matches[1] -ge $sequence) {
              throw 'Rule sequence must exceed all published rule releases'
            }
          }
          "RULE_STABLE_EXISTS=$($tags -contains 'rules-stable')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and authenticate signed package
        shell: pwsh
        run: cargo run --example rules -- sign $env:RULE_SEQUENCE rule-dist
      - name: Publish immutable package and stable channel
        shell: pwsh
        run: |
          gh release create "rules-v$env:RULE_SEQUENCE" rule-dist/rules.json rule-dist/manifest.json rule-dist/manifest.sig --prerelease --latest=false --title "Cleanup rules v$env:RULE_SEQUENCE" --notes 'Official declarative cleanup policy.'
          if ($LASTEXITCODE -ne 0) { throw 'Immutable release failed' }
          if ($env:RULE_STABLE_EXISTS -ne 'True') {
            gh release create rules-stable --prerelease --latest=false --title 'Official rules stable channel' --notes 'Signed channel manifest. Applied on the next scan.'
            if ($LASTEXITCODE -ne 0) { throw 'Stable channel creation failed' }
          }
          gh release upload rules-stable rule-dist/manifest.json rule-dist/manifest.sig --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Channel update failed; immutable package remains recoverable' }
