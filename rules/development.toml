zh = "Kiro"
en = "Kiro"

[[catalogs.vscode_family]]
path = ".antigravity"
zh = "Antigravity"
en = "Antigravity"

# 固定叶子。版本化的 Zed `node-v*` 缓存不在这里，扫描时读目录才知道版本号。
# languages 是已下载的语言服务器，删了要重新拉，所以不预选。
[[entries]]
root = "home"
path = ".grok/logs"
zh = "Grok · 日志"
en = "Grok · logs"
category = "AiAgents"
operation = "contents"
disposal = "permanent"
recommended = true

[[entries]]
root = "roaming"
path = "Zed/node/cache"
zh = "Zed · npm 缓存"
en = "Zed · npm cache"
category = "AiAgents"
operation = "contents"
disposal = "permanent"
recommended = true

[[entries]]
root = "roaming"
path = "Zed/languages"
zh = "Zed · LSP 语言服务器"
en = "Zed · LSP language servers"
category = "AiAgents"
operation = "contents"
disposal = "permanent"
recommended = false

