# 孤儿扫描的目录白名单（`(相对 ~/Library 的路径, 来源)`）。已安装应用的枚举
# 无法保证覆盖未被 Spotlight 索引的自定义安装位置，因此孤儿条目一律不预选，
# 缓存和日志也只能由用户逐项选择。
#
# **故意不收的三处**：`Containers`、`Group Containers`、`Application Scripts`。
# 它们是沙盒应用的用户数据本体（本地数据库、用户写的自动化脚本），量大且风险
# 集中，要先有一个「按应用分组勾选」的界面才值得做。少收的位置只让人漏清，
# 多收的位置会删掉活人的数据。
[[locations.orphan_roots]]
path = "Caches"
source = "CacheDir"

[[locations.orphan_roots]]
path = "HTTPStorages"
source = "Other"

[[locations.orphan_roots]]
path = "Logs"
source = "LogDir"

[[locations.orphan_roots]]
path = "Saved Application State"
source = "Other"

[[locations.orphan_roots]]
path = "WebKit"
source = "CacheDir"

[[locations.orphan_roots]]
path = "Preferences"
source = "PreferenceFile"

[[locations.orphan_roots]]
path = "Preferences/ByHost"
source = "PreferenceFile"

[[locations.orphan_roots]]
path = "Application Support"
source = "AppSupportDir"

[[locations.orphan_roots]]
path = "LaunchAgents"
source = "LaunchAgent"

# qingjian-team/qingjian c08ae57；此摘要与参数组合保留学习数据和密钥。
# 仅支持经过核验的独立脚本，不支持依赖脚本文件路径或旁置资源的脚本。
[[script_uninstallers]]
bundle_id = "app.qingjian.inputmethod"
script = "Contents/Resources/uninstall.sh"
sha256 = ["c08b62f66d9fe23222dd5e05565d56e98d3c9c6a39da7a6fab44c232bb76ac24"]
interpreter = "sh"
arguments = []
preserves_user_data = true
user_bundles = ["Library/Input Methods/Qingjian.app"]
system_bundles = ["Library/Input Methods/Qingjian.app"]
