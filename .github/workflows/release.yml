name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

# 发布包由 Go 产品构建。资产名与包内结构与 Rust 时期完全相同：
# 已安装的 Rust 与 Go 版本的更新器都按这些名字、zip 里的 quick-cleaner.exe /
# QuickCleaner.app 认领更新，改名会让存量用户收不到更新。
#
# 签名按 secrets 是否存在自动启用，缺省时与 Rust 时期行为一致
# （Windows 不签名，macOS ad-hoc）：
#   WINDOWS_SIGN_PFX_BASE64, WINDOWS_SIGN_PASSWORD
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   （公证；需要上面的 Developer ID）

jobs:
  verify:
    name: Verify version and resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Tag matches the product version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -nE 's/^const Version = "([0-9.]+)".*/\1/p' internal/app/root.go)
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match internal/app Version $version"
            exit 1
          fi
      - name: Windows resources are current
        run: go run ./tools/winres -check

  build-windows:
    name: Build & Release (Windows x86_64)
    needs: verify
    runs-on: windows-latest
    env:
      WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
      WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Import signing certificate
        if: env.WINDOWS_SIGN_PFX_BASE64 != '' && env.WINDOWS_SIGN_PASSWORD != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "quick-cleaner-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGN_PFX_BASE64))
          "WINDOWS_SIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package Windows distribution
        shell: pwsh
        run: ./scripts/package-windows.ps1 -OutputDir dist

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP "quick-cleaner-sign.pfx")

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            dist/quick-cleaner-windows-x86_64.zip
            dist/quick-cleaner-windows-x86_64.zip.sha256
          retention-days: 7

  build-macos:
    name: Build & Release (macOS Universal, aarch64, x86_64)
    needs: verify
    runs-on: macos-latest
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY_SECRET: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Import Developer ID certificate
        if: env.MACOS_CERT_P12_BASE64 != '' && env.MACOS_CERT_PASSWORD != '' && env.MACOS_SIGN_IDENTITY_SECRET != ''
        run: |
          keychain="$RUNNER_TEMP/quick-cleaner-sign.keychain-db"
          password="$(uuidgen)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "MACOS_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY_SECRET" >> "$GITHUB_ENV"

      - name: Package macOS distributions
        run: |
          chmod +x scripts/package-macos.sh scripts/sign-and-notarize.sh
          mkdir -p dist
          notarize=false
          if [ -n "${MACOS_SIGN_IDENTITY:-}" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            notarize=true
          fi
          # universal 为推荐包（同时支持 Apple Silicon 与 Intel）
          for variant in universal:universal aarch64:arm64 x86_64:amd64; do
            name="${variant%%:*}"
            arch="${variant#*:}"
            ./scripts/package-macos.sh "dist/$name" "$arch"
            if [ "$notarize" = true ]; then
              ./scripts/sign-and-notarize.sh "dist/$name/QuickCleaner.app" "$MACOS_SIGN_IDENTITY" "$APPLE_ID" "$APPLE_TEAM_ID" "$APPLE_APP_PASSWORD"
            fi
            (cd "dist/$name" && zip -r -y "../quick-cleaner-macos-$name.zip" QuickCleaner.app)
            shasum -a 256 "dist/quick-cleaner-macos-$name.zip" | awk -v n="quick-cleaner-macos-$name.zip" '{print $1"  "n}' > "dist/quick-cleaner-macos-$name.zip.sha256"
            rm -rf "dist/$name"
          done

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/quick-cleaner-sign.keychain-db" 2>/dev/null || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: |
            dist/quick-cleaner-macos-*.zip
            dist/quick-cleaner-macos-*.zip.sha256
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact directories
        run: |
          find dist -name "*.zip" -exec mv {} dist/ \;
          find dist -name "*.sha256" -exec mv {} dist/ \;

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/quick-cleaner-windows-x86_64.zip
            dist/quick-cleaner-windows-x86_64.zip.sha256
            dist/quick-cleaner-macos-universal.zip
            dist/quick-cleaner-macos-universal.zip.sha256
            dist/quick-cleaner-macos-aarch64.zip
            dist/quick-cleaner-macos-aarch64.zip.sha256
            dist/quick-cleaner-macos-x86_64.zip
            dist/quick-cleaner-macos-x86_64.zip.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
