[package]
name = "quick-cleaner"
version = "0.0.1"
edition = "2021"
default-run = "quick-cleaner"

[dependencies]
gpui = { version = "0.2.2", default-features = false }
walkdir = "2"
rayon = "1"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["shellapi", "winbase", "winnt", "minwinbase", "fileapi", "handleapi", "shobjidl", "ioapiset", "winioctl", "errhandlingapi", "processthreadsapi", "securitybaseapi", "sddl", "winreg", "tlhelp32", "impl-default"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[package.metadata.bundle]
name = "QuickCleaner"
identifier = "com.quickcleaner.app"
category = "Utilities"
short_description = "Windows disk cleaner inspired by Clean My Mac"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

# MFT 解析是纯计算密集循环，debug 下不开优化测出来的耗时没有参考价值。
# 依赖已经在 profile.dev.package."*" 里是 opt-level 2，这里只额外优化本 crate，
# 不会触发依赖重编译。
[profile.dev.package.quick-cleaner]
opt-level = 2
