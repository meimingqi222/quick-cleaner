name: Verify regression notes
on:
  push:
    paths: ['docs/agent-notes/**', 'docs/PITFALLS.md', 'internal/**', 'cmd/**', 'scripts/**', 'tools/regression-notes/**', '.github/workflows/agent-notes.yml']
  pull_request:
    paths: ['docs/agent-notes/**', 'docs/PITFALLS.md', 'internal/**', 'cmd/**', 'scripts/**', 'tools/regression-notes/**', '.github/workflows/agent-notes.yml']
  workflow_dispatch:
env:
  # The Rust reference tree (src/, examples/) and its UI guard scripts were
  # deleted on 2026-11-01. Notes keep citing them as the history they were
  # written against; those citations are not required to exist. Go and Python
  # citations still are.
  RETIRED: --retired-prefix src/ --retired-prefix examples/ --retired-prefix scripts/test_ui_
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -X utf8 tools/regression-notes/verify-notes.py --notes-dir docs/agent-notes --strict-anchors $RETIRED
      # A renamed test can survive as a substring in a comment; anchors must
      # name a real `func`/`def` declaration in the cited file.
      - run: |
          python -X utf8 tools/regression-notes/verify-notes.py --notes-dir docs/agent-notes --dump-anchors > anchors.txt
          python -X utf8 scripts/check-anchors-vs-tests.py anchors.txt $RETIRED
      # 这个工具本身也是门禁：它的回归测试随仓库走，别让它带着已知缺陷继续放行 note。
      - run: python -X utf8 -m unittest discover -s tools/regression-notes/tests
      - run: python -X utf8 scripts/check-pitfall-notes.py
