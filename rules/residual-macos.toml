id = "residual-macos"
version = 4
platform = "macos"
required = ["file", "registration"]

# Bundle-ID evidence and family exclusion algorithms remain fixed in Rust.
[lists]
# 官方交互式/驱动卸载不能用删 bundle 替代。来源为 tested-apps 对应产品完整指南。
manual_uninstall_bundle_ids = [
  "app.msime.macos", "app.msime.inputmethod.MetasequoiaIME", "app.msime.macos.pinyin", "app.msime.inputmethod.pinyin",
  "app.msime.macos.wubi", "app.msime.inputmethod.wubi", "app.msime.macos.japanese", "app.msime.inputmethod.japanese",
  "app.msime.macos.vietnamese", "app.msime.inputmethod.vietnamese", "app.msime.macos.tibetan", "app.msime.inputmethod.tibetan",
  "com.docker.docker", "com.teamviewer.TeamViewer", "at.obdev.littlesnitchmini", "com.nssurge.surge-mac",
  "com.synology.CloudStationUI", "com.displaylink.DisplayLinkUserAgent", "com.wacom.WacomCenter", "com.elgato.StreamDeck",
]

manual_app_support_bundle_ids = ["app.qingjian.inputmethod"]
# https://mole.fit/tested-apps/zoom — 官方入口在 Frameworks，不在 Resources。
"embedded_uninstaller:us.zoom.xos" = ["Contents/Frameworks/ZoomUninstaller.app"]
helper_id_suffixes = [".helper.renderer", ".helper.plugin", ".helper.alerts", ".helper.gpu", ".helper.np", ".helper", ".shipit", ".sparkle", ".xpc"]
shared_vendor_prefixes = ["com.apple", "com.google", "com.microsoft", "com.adobe", "com.amazon", "com.oracle", "com.jetbrains", "org.mozilla", "org.chromium", "com.electron", "net.java"]
dot_config_parents = ["", ".config", ".cache", ".local/share", ".local/state"]
protected_dot_dirs = ["config", "cache", "local", "ssh", "gnupg", "aws", "kube", "docker", "npm", "cargo", "rustup", "gradle", "nvm", "pyenv", "vim", "git", "trash"]
id_file_suffixes = [".plist", ".binarycookies", ".savedstate", ".sfl2", ".sfl3", ".sfl4"]

