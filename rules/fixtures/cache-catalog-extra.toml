id = "cache"
version = 4
platform = "all"
required = ["file", "updater_artifacts", "directory_selection"]

[lists]
updater_directories_exact = ["pending"]
updater_directories_prefixes = ["update."]
updater_files_exact = ["update.zip", "latest-mac.yml", "latest.yml", "update-info.json", "ShipItState.plist", "ShipIt_stdout.log", "ShipIt_stderr.log"]
updater_files_suffixes = [".blockmap"]
updater_display_suffixes = ["-updater", ".ShipIt"]
# Apple 系统服务目录不做更新包探测：签名表按第三方更新器的产物形态做的，
# 对守护进程目录没有意义；这些目录只展示，不按产物拆分。
updater_probe_exclude_prefixes = ["com.apple."]

# ~/.cache 布局：整个枚举走声明式 catalog_children 选择。目录规则自带的
# category/recommended 是认不出的目录的兜底形态（只展示、不预选）；
# catalogs.agents/packages/shown 的派发策略在 select.catalog_policy 里声明；
# Chromium 数据目录的内容签名与叶子词汇来自 chromium 规则（leaf_policy），
# 叶子的推荐由 chromium.toml 的 shown_leaves 决定，根目录与登录态不入表。
[[directories]]
id = "home_cache"
root = "home"
paths = [".cache"]
zh = "~/.cache/{name}"
en = "~/.cache/{name}"
category = "UserTemp"
operation = "contents"
disposal = "permanent"
recommended = false
[directories.select]
kind = "catalog_children"
[directories.select.catalog_policy]
agents = { category = "AiAgents", recommended = true }
packages = { category = "PackageCache", recommended = true }
shown = { category = "PackageCache", recommended = false }
[directories.select.leaf_policy]
signature = "chromium"
category = "UserCache"
zh = "~/.cache/{name} · {trail}"
en = "~/.cache/{name} · {trail}"

[numbers]
updater_stale_seconds = 604800

# ~/.cache 下确认能重建的包缓存：工具自带 cache clean，或删掉后下一次构建自己长回来。
[[catalogs.packages]]
path = "uv"
zh = "uv 缓存"
en = "uv cache"

[[catalogs.packages]]
path = "pip"
zh = "pip 缓存"
en = "pip cache"

[[catalogs.packages]]
path = "pre-commit"
zh = "pre-commit 缓存"
en = "pre-commit cache"

[[catalogs.packages]]
path = "node-gyp"
zh = "node-gyp 缓存"
en = "node-gyp cache"

[[catalogs.packages]]
path = "typescript"
zh = "TypeScript 缓存"
en = "TypeScript cache"

[[catalogs.packages]]
path = "go-build"
zh = "Go 构建缓存"
en = "Go build cache"

[[catalogs.packages]]
path = "gopls"
zh = "gopls 缓存"
en = "gopls cache"

# 配置增量示例：新增一个确认能重建的包缓存目录，只需在这里加一行。
[[catalogs.packages]]
path = "cache-tool"
zh = "CacheTool 缓存"
en = "CacheTool cache"

# 包缓存，但不能预选。pypoetry 里除了下载缓存还住着 virtualenvs/，
# 重建是一次完整 install。纯下载子层的路径没有在本机确认过，所以整项降级，
# 不切一个没验证过的路径。类别仍是包缓存，不能掉进认不出的临时目录。
[[catalogs.shown]]
path = "pypoetry"
zh = "Poetry 缓存"
en = "Poetry cache"

[[catalogs.agents]]
path = "opencode"
zh = "OpenCode · 缓存"
en = "OpenCode · cache"
