name: CI

on:
  push:
    branches: [ "master", "main" ]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
      - ".github/workflows/release.yml"
  pull_request:
    branches: [ "master", "main" ]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      # clippy 而不只是 rustc：registry.rs 那批「public fn 收裸指针却不是 unsafe」
      # 属于 deny 级 lint，cargo build/test 全绿也照样漏过去。
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test
      # 绑定 anchor 必须是测试二进制里真实存在的用例：文件内 substring 校验
      # 挡不住「改名后旧名字留在注释里」。#[cfg] 门控的用例只在对应平台的
      # 二进制里存在，所以两个 job 各产一份 --list 产物，由 verify-anchors
      # job 取并集校验。
      - name: Dump test list
        run: cargo test --lib -- --list > testlist-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: testlist-windows
          path: testlist-windows.txt
          retention-days: 1

  # 只跑 Windows 的代价已经吃过一次：`src/bin/mftscan.rs` 无条件 import
  # `platform::mft`，macOS 上 `cargo build` 直接失败，却一直没人拦住。
  # 平台适配层是双分支的，CI 也必须是。
  test-macos:
    name: Test (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # 废纸篓往返那个用例标了 #[ignore]：它会真的往运行者的废纸篓里写东西。
      - name: Run tests
        run: cargo test
      - name: Dump test list
        run: cargo test --lib -- --list > testlist-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: testlist-macos
          path: testlist-macos.txt
          retention-days: 1

  verify-anchors:
    name: Bound anchors are real tests
    needs: [test, test-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v4
        with:
          pattern: testlist-*
      - run: python -X utf8 tools/regression-notes/verify-notes.py --notes-dir docs/agent-notes --dump-anchors > anchors.txt
      - run: python -X utf8 scripts/check-anchors-vs-tests.py anchors.txt testlist-windows/testlist-windows.txt testlist-macos/testlist-macos.txt
