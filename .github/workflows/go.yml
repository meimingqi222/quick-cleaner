name: Go migration

on:
  push:
    paths: ["go.mod", "go.sum", "cmd/**", "internal/**", "assets/**", "rules/**", ".github/workflows/go.yml"]
  pull_request:
    paths: ["go.mod", "go.sum", "cmd/**", "internal/**", "assets/**", "rules/**", ".github/workflows/go.yml"]

jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal assets rules)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
