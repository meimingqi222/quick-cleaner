name: Release (Windows Packaging)

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release-windows:
    name: Build & Package Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run automated test suite
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Prepare release package
        shell: pwsh
        run: |
          $distDir = "dist/quick-cleaner-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          
          # 复制主程序与工具二进制
          Copy-Item "target/release/quick-cleaner.exe" "$distDir/"
          Copy-Item "target/release/mftscan.exe" "$distDir/"
          
          # 复制双语说明与协议
          if (Test-Path "README.md") { Copy-Item "README.md" "$distDir/" }
          if (Test-Path "README_zh.md") { Copy-Item "README_zh.md" "$distDir/" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "$distDir/" }
          
          # 压缩发布包
          Compress-Archive -Path "$distDir/*" -DestinationPath "dist/quick-cleaner-windows-x86_64.zip" -Force
          
          # 计算 SHA256 校验和
          $hash = (Get-FileHash -Path "dist/quick-cleaner-windows-x86_64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  quick-cleaner-windows-x86_64.zip" | Out-File -Encoding utf8 "dist/quick-cleaner-windows-x86_64.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quick-cleaner-windows-x86_64
          path: |
            dist/quick-cleaner-windows-x86_64.zip
            dist/quick-cleaner-windows-x86_64.zip.sha256
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/quick-cleaner-windows-x86_64.zip
            dist/quick-cleaner-windows-x86_64.zip.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
