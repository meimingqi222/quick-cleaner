[package]
name = "quick-cleaner"
version = "0.0.3"
edition = "2021"
default-run = "quick-cleaner"

[dependencies]
# `default-features = false` 关掉 Linux 的 wayland/x11 和 Windows 的 manifest，
# 但必须保留 `font-kit`——否则 macOS 上会用 NoopTextSystem，文字全部不可见
# （光栅化返回空像素，布局占位但渲染透明）。
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
walkdir = "2"
rayon = "1"
dirs = "5"
serde = { version = "1", features = ["derive"] }
# 只给 core/settings.rs 用：读写 %APPDATA%\QuickCleaner\settings.json
serde_json = "1"
chrono = "0.4"
lz4_flex = "0.14.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[lints.rust]
# objc 0.2 的 `msg_send!` 展开里带着 `#[cfg(feature = "cargo-clippy")]`——那是
# clippy 早年的检测方式，现已废弃。每个调用点都会报一条 unexpected_cfgs，
# 而 CI 跑的是 `clippy -- -D warnings`，不消掉会直接挂。
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[target.'cfg(target_os = "macos")'.dependencies]
bincode = "1.3.3"
fsevent-sys = "4.1.0"
zstd = "0.13"
# 卷容量走 statfs(2)，废纸篓走 NSFileManager。两者都要 C / Objective-C 运行时；
# libc 与 objc 本来就作为传递依赖在依赖树里，显式声明不引入新的下载。
libc = "0.2"
objc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["shellapi", "winbase", "winnt", "minwinbase", "fileapi", "handleapi", "shobjidl", "ioapiset", "winioctl", "errhandlingapi", "processthreadsapi", "securitybaseapi", "sddl", "winreg", "tlhelp32", "winnls", "impl-default"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[package.metadata.bundle]
name = "QuickCleaner"
identifier = "com.quickcleaner.app"
icon = ["assets/icon.icns", "assets/icon-512.png", "assets/icon.png"]
category = "Utilities"
short_description = "Cross-platform disk cleaner and space analyzer"
long_description = "QuickCleaner scans for junk files, analyzes disk usage, and manages installed applications on macOS and Windows."

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

# MFT 解析是纯计算密集循环，debug 下不开优化测出来的耗时没有参考价值。
# 依赖已经在 profile.dev.package."*" 里是 opt-level 2，这里只额外优化本 crate，
# 不会触发依赖重编译。
[profile.dev.package.quick-cleaner]
opt-level = 2
