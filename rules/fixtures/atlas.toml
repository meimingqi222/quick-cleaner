id = "atlas-fixture"
version = 1
platform = "windows"
required = ["source_install", "python_module", "registration", "source_flow"]
[app]
actions = ["revalidate", "official_operation", "supplement_cleanup", "verify_completion", "remove_recovery_records"]
completion = "artifacts_and_registrations_absent"
name = "Atlas Fixture"
default_home = "atlas-example"
source = "checkout"
targets = ["commands/atlas.exe", "checkout/gui/Atlas.exe"]
source_file = "project.txt"
source_signature = "owner = atlas-fixture"
constants = "atlas_constants.py"
source_owner = ".owner"
stamp = "version.json"
version_pointer = "/version"
state_dir = "records"
state_facts = "dependencies.json"
environment_pointer = "/runtime/environment"
environments = "generations"
environment_name = "runtime"
tools_dir = "dependencies"
tool_facts = "owned.json"
tool_lock = ".lock"
launchers = ["commands/atlas.exe", "commands/atlas.cmd"]
profiles = "named-profiles"
module = "atlas_cli.remove"
module_file = "atlas_cli/remove.py"
module_args = ["--preserve-data"]
home_variable = "ATLAS_HOME"
python_prefix = "cpython-"
installer = "atlas-bootstrap.exe"
installer_signature = "atlas_fixture_bootstrap"
bootstrap_dir = "installer-cache"
bootstrap_prefix = "bootstrap-"
bootstrap_extensions = ["ps1"]
gateway_dir = "daemon"
gateway_files = ["AtlasDaemon.cmd"]
task_prefix = "AtlasDaemon"
path_prefixes = ["checkout", "commands", "dependencies"]
environment_variables = ["ATLAS_HOME"]
preserve = ["preferences.json", "history", ".secrets"]
installer_process = "atlas-bootstrap.exe"
unknown_processes = ["atlas.exe", "python.exe"]
